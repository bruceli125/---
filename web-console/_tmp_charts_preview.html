<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>charts.js 视觉自检</title>
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/base.css" />
<style>
  body { overflow: auto; background: var(--bg-base); }
  .wrap { max-width: 1360px; margin: 0 auto; padding: 28px 28px 60px; position: relative; }
  .h { display:flex; align-items:baseline; gap:10px; margin-bottom:18px; }
  .h h1 { font-size: 17px; font-weight: 600; letter-spacing: .01em; }
  .h span { color: var(--text-3); font-size: 12px; }
  .grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 16px; }
  .card {
    background: linear-gradient(180deg, var(--glass-1), rgba(255,255,255,0.012));
    border: 1px solid var(--stroke-1);
    border-radius: var(--r-md);
    padding: 14px 16px 10px;
    box-shadow: var(--shadow-1);
    min-width: 0;
  }
  .card__top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom: 6px; }
  .card__t { font-size: 13px; font-weight: 600; color: var(--text-1); }
  .card__s { font-size: 11px; color: var(--text-3); margin-top: 2px; }
  .card__v { font-family: var(--font-mono); font-size: 20px; font-weight: 600; color: var(--text-1); letter-spacing: 0; }
  .card__v small { font-size: 11px; color: var(--text-3); font-weight: 500; margin-left: 4px; }
  .chart { position: relative; }
  .stats { display:grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 16px; }
  .stat { background: rgba(255,255,255,0.025); border:1px solid var(--stroke-1); border-radius: var(--r-sm); padding: 12px 14px 8px; }
  .stat__k { font-size: 11px; color: var(--text-3); letter-spacing: .06em; text-transform: uppercase; }
  .stat__v { font-family: var(--font-mono); font-size: 19px; font-weight: 600; margin-top: 2px; }
  .stat__d { font-size: 11px; color: var(--teal); font-family: var(--font-mono); }
  .row { display:grid; grid-template-columns: 1fr 1fr; gap:16px; margin-top:16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="h"><h1>运营控制台 · 图表引擎自检</h1><span>tokens.css / base.css 真实环境渲染</span></div>

  <div class="grid">
    <div class="card">
      <div class="card__top">
        <div>
          <div class="card__t">家教需求与成交趋势</div>
          <div class="card__s">近 6 个月 · 按自然月统计</div>
        </div>
        <div class="card__v tabular">31<small>单</small></div>
      </div>
      <div class="chart" id="c-line" style="height:236px"></div>
    </div>

    <div class="card">
      <div class="card__top">
        <div>
          <div class="card__t">近 8 周履约打卡</div>
          <div class="card__s">颜色越深打卡越完整</div>
        </div>
      </div>
      <div class="chart" id="c-heat" style="height:236px"></div>
    </div>
  </div>

  <div class="row">
    <div class="card">
      <div class="card__top">
        <div>
          <div class="card__t">认证转化漏斗</div>
          <div class="card__s">本月申请 → 签约</div>
        </div>
      </div>
      <div class="chart" id="c-funnel" style="height:250px"></div>
    </div>

    <div class="card">
      <div class="card__top">
        <div>
          <div class="card__t">城市订单分布</div>
          <div class="card__s">堆叠：一对一 / 小班 / 试讲</div>
        </div>
      </div>
      <div class="chart" id="c-bar" style="height:250px"></div>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat__k">今日新增需求</div>
      <div class="stat__v tabular">128</div>
      <div class="chart" id="c-sp1" style="height:34px;margin-top:6px"></div>
    </div>
    <div class="stat">
      <div class="stat__k">在途订单</div>
      <div class="stat__v tabular">46</div>
      <div class="chart" id="c-sp2" style="height:34px;margin-top:6px"></div>
    </div>
    <div class="card" style="padding:12px 14px">
      <div class="card__top" style="margin-bottom:0">
        <div class="card__t">教员构成</div>
      </div>
      <div class="chart" id="c-donut" style="height:150px"></div>
    </div>
  </div>
</div>

<script src="js/charts.js"></script>
<script>
(function () {
  var fmt = function (v) { return v + ' 单'; };

  window.Charts.line(document.getElementById('c-line'), {
    labels: ['1月', '2月', '3月', '4月', '5月', '6月'],
    series: [
      { name: '需求数', data: [12, 18, 15, 26, 22, 31], color: 'var(--accent)', type: 'area' },
      { name: '成交数', data: [6, 9, 8, 14, 12, 19], color: 'var(--teal)' }
    ],
    valueFormat: fmt,
    yTicks: 4
  });

  window.Charts.heatmap(document.getElementById('c-heat'), {
    labels: ['一', '二', '三', '四', '五', '六', '日'],
    rowLabels: ['W1', 'W2', 'W3', 'W4', 'W5', 'W6', 'W7', 'W8'],
    rows: [
      [3, 2, 3, 1, 2, 0, 0],
      [2, 3, 3, 2, 3, 1, 0],
      [3, 3, 2, 3, 3, 2, 1],
      [1, 2, 3, 3, 2, 3, 2],
      [3, 3, 3, 2, 3, 3, 1],
      [2, 2, 3, 3, 3, 2, 0],
      [3, 3, 2, 3, 2, 2, 1],
      [3, 2, null, 3, 3, 3, 2]
    ],
    valueFormat: function (v) { return v + ' 次'; }
  });

  window.Charts.funnel(document.getElementById('c-funnel'), {
    labels: ['提交申请', '资料初审', '线上面试', '试讲评估', '正式签约'],
    series: [{ name: '人数', data: [1280, 964, 612, 388, 251] }],
    valueFormat: function (v) { return v + ' 人'; },
    unit: '人'
  });

  window.Charts.bar(document.getElementById('c-bar'), {
    labels: ['北京', '上海', '广州', '成都', '杭州'],
    stacked: true,
    series: [
      { name: '一对一', data: [42, 38, 26, 18, 15] },
      { name: '小班', data: [18, 16, 12, 9, 7] },
      { name: '试讲', data: [9, 8, 6, 4, 3] }
    ],
    valueFormat: fmt
  });

  window.Charts.sparkline(document.getElementById('c-sp1'), {
    series: [{ name: '新增需求', data: [8, 12, 9, 15, 13, 19, 17, 22, 20, 26] }]
  });
  window.Charts.sparkline(document.getElementById('c-sp2'), {
    series: [{ name: '在途订单', data: [22, 20, 24, 21, 18, 17, 19, 15, 14, 12] }],
    fill: true
  });

  window.Charts.donut(document.getElementById('c-donut'), {
    labels: ['已认证', '审核中', '已拒绝', '未提交'],
    series: [{ name: '数量', data: [62, 21, 9, 8] }],
    centerValue: '1,284',
    centerLabel: '教员总数',
    valueFormat: function (v) { return v + ' 人'; }
  });

  // 截图用：1.1s 后在折线图上模拟一次 hover（展示指示线 + 数据点 + tooltip）
  setTimeout(function () {
    var cv = document.querySelector('#c-line canvas');
    if (!cv) return;
    var r = cv.getBoundingClientRect();
    var ev = new MouseEvent('mousemove', {
      clientX: r.left + r.width * 0.62,
      clientY: r.top + r.height * 0.5,
      bubbles: true
    });
    cv.dispatchEvent(ev);
  }, 1100);
})();
</script>
</body>
</html>
