<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>BG 视觉校验 · Three 路径</title>
<link rel="stylesheet" href="../web-console/css/tokens.css" />
<link rel="stylesheet" href="../web-console/css/base.css" />
<style>
  /* 仅用于校验背景对可读性的影响：一个典型的后台内容层 */
  .app { position: relative; z-index: var(--z-base); display: flex; height: 100vh; }
  .side {
    width: var(--sidebar-w); flex: 0 0 auto; padding: var(--s-4);
    border-right: 1px solid var(--stroke-1);
    background: linear-gradient(180deg, rgba(11,16,25,.72), rgba(7,10,18,.55));
    backdrop-filter: blur(var(--blur-md));
    display: flex; flex-direction: column; gap: var(--s-5);
  }
  .brand { display: flex; align-items: center; gap: var(--s-3); font-weight: 700; letter-spacing: .04em; }
  .brand i { width: 26px; height: 26px; border-radius: 8px; display: block;
    background: linear-gradient(135deg, var(--accent), var(--violet)); box-shadow: var(--glow-accent); }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav a { padding: 8px 10px; border-radius: var(--r-sm); color: var(--text-2); font-size: var(--fs-13); }
  .nav a.on { background: var(--glass-2); color: var(--text-1); box-shadow: inset 0 0 0 1px var(--stroke-1); }
  .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .top {
    height: var(--topbar-h); flex: 0 0 auto; display: flex; align-items: center; gap: var(--s-4);
    padding: 0 var(--s-6); border-bottom: 1px solid var(--stroke-1);
    background: rgba(7,10,18,.55); backdrop-filter: blur(var(--blur-md));
  }
  .top h1 { font-size: var(--fs-17); font-weight: 650; }
  .pill { margin-left: auto; font-size: var(--fs-12); color: var(--text-2); padding: 5px 10px;
    border-radius: var(--r-pill); background: var(--glass-1); box-shadow: inset 0 0 0 1px var(--stroke-1); }
  .body { flex: 1 1 auto; overflow: hidden; padding: var(--s-6); display: grid;
    grid-template-columns: repeat(4, 1fr); gap: var(--s-4); align-content: start; }
  .card { background: var(--glass-1); border-radius: var(--r-md); padding: var(--s-4) var(--s-5);
    box-shadow: inset 0 0 0 1px var(--stroke-1), var(--shadow-1); }
  .card .k { font-size: var(--fs-11); letter-spacing: .09em; text-transform: uppercase; color: var(--text-3); }
  .card .v { font-size: var(--fs-30); font-weight: 650; letter-spacing: -.01em; margin-top: 6px; }
  .card .v small { font-size: var(--fs-13); color: var(--text-2); font-weight: 500; margin-left: 6px; }
  .panel { grid-column: span 2; background: var(--glass-1); border-radius: var(--r-md); padding: var(--s-5);
    box-shadow: inset 0 0 0 1px var(--stroke-1), var(--shadow-1); }
  .panel h2 { font-size: var(--fs-13); font-weight: 600; color: var(--text-2); margin-bottom: var(--s-3); }
  .row { display: flex; justify-content: space-between; font-size: var(--fs-13); color: var(--text-2);
    padding: 7px 0; border-bottom: 1px solid var(--stroke-inset); }
  .row b { color: var(--text-1); font-weight: 600; }
  .tag { font-size: var(--fs-11); padding: 2px 8px; border-radius: var(--r-pill);
    background: var(--teal-soft); color: var(--teal); }
  #badge { position: fixed; right: 14px; bottom: 12px; z-index: 99; font: 12px var(--font-mono);
    color: var(--text-3); background: rgba(4,6,11,.6); padding: 4px 9px; border-radius: 6px; }
</style>
</head>
<body>
<div class="atmos">
  <div class="atmos__mesh"></div>
  <div class="atmos__grid"></div>
  <div class="atmos__grain"></div>
  <canvas class="atmos__canvas" id="bg-canvas"></canvas>
  <div class="atmos__vignette"></div>
</div>

<div class="app">
  <aside class="side">
    <div class="brand"><i></i><span>京师家教</span></div>
    <nav class="nav">
      <a class="on" href="#">总览</a><a href="#">订单</a><a href="#">教师库</a>
      <a href="#">排课</a><a href="#">结算</a><a href="#">设置</a>
    </nav>
  </aside>
  <div class="main">
    <header class="top"><h1>运营总览</h1><span class="pill">近 7 日</span></div>
    <main class="body">
      <div class="card"><div class="k">今日成交</div><div class="v num">1,284<small>单</small></div></div>
      <div class="card"><div class="k">GMV</div><div class="v num">¥86.4<small>万</small></div></div>
      <div class="card"><div class="k">活跃教师</div><div class="v num">742<small>人</small></div></div>
      <div class="card"><div class="k">履约率</div><div class="v num">98.2<small>%</small></div></div>
      <div class="panel">
        <h2>区域分布</h2>
        <div class="row"><span>海淀区</span><b class="num">4,120</b></div>
        <div class="row"><span>朝阳区</span><b class="num">3,268</b></div>
        <div class="row"><span>西城区</span><b class="num">2,470</b></div>
        <div class="row"><span>东城区</span><b class="num">1,905</b></div>
        <div class="row"><span>丰台区</span><b class="num">1,340</b></div>
      </div>
      <div class="panel">
        <h2>最近订单</h2>
        <div class="row"><span>高三 · 数学冲刺</span><b class="num">¥2,880</b></div>
        <div class="row"><span>初三 · 英语口语</span><b class="num">¥1,560</b></div>
        <div class="row"><span>高二 · 物理实验</span><b class="num">¥2,100</b></div>
        <div class="row"><span>小学 · 奥数启蒙</span><b class="num">¥980</span></div>
        <div class="row"><span>高二 · 化学竞赛 <span class="tag">已确认</span></span><b class="num">¥3,240</b></div>
      </div>
    </main>
  </div>
</div>
<div id="badge">mode: –</div>

<script src="../web-console/js/three-bg.js"></script>
<script>
  var cv = document.getElementById('bg-canvas');
  window.BG.init(cv, { dprLimit: 2 });
  document.getElementById('badge').textContent = 'mode: ' + window.BG.mode;
  // 模拟鼠标偏移：视差应在若干帧内阻尼收敛（截图中应已就位）
  window.BG.setParallax(0.62, -0.38);
  setTimeout(function () {
    document.getElementById('badge').textContent =
      'mode: ' + window.BG.mode + ' · points: ' + (window.__pt || 'n/a');
  }, 1200);
</script>
</body>
</html>
