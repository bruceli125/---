<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>bg diag</title>
<link rel="stylesheet" href="../web-console/css/tokens.css" />
<link rel="stylesheet" href="../web-console/css/base.css" />
<style>html,body{overflow:hidden}.atmos__mesh,.atmos__grid,.atmos__grain,.atmos__vignette{display:none}</style>
</head>
<body>
<div class="atmos">
  <canvas class="atmos__canvas" id="bg-canvas"></canvas>
</div>
<pre id="out">pending</pre>

<script>
  // 1) 抓 console 警告（three 着色器报错只走 console，不抛异常）
  var logs = [];
  var ow = console.warn, oe = console.error;
  console.warn = function () { logs.push('WARN: ' + Array.prototype.join.call(arguments, ' ')); ow && ow.apply(console, arguments); };
  console.error = function () { logs.push('ERR: ' + Array.prototype.join.call(arguments, ' ')); oe && oe.apply(console, arguments); };
  window.onerror = function (m, s, l) { logs.push('ONERROR: ' + m + ' @' + l); };
</script>
<script src="three.r128.min.js"></script>
<script>
  // 2) 抓住 renderer 实例，并记录每次 render 的 scene/camera
  var R = THREE.WebGLRenderer;
  window.__lastScene = null; window.__lastCam = null;
  var Wrapped = function (opts) {
    var r = new R(opts);
    window.__r = r;
    var orig = r.render;
    r.render = function (scene, cam) {
      window.__lastScene = scene; window.__lastCam = cam;
      return orig.call(r, scene, cam);
    };
    return r;
  };
  Wrapped.prototype = R.prototype;
  THREE.WebGLRenderer = Wrapped;
</script>
<script src="../web-console/js/three-bg.js"></script>
<script>
  window.BG.init(document.getElementById('bg-canvas'), { dprLimit: 2 });

  function stat(arr) {
    var nz = 0, max = 0, sum = 0;
    for (var i = 0; i < arr.length; i += 4) {
      var v = arr[i] + arr[i + 1] + arr[i + 2];
      if (v > 0) nz++;
      if (v > max) max = v;
      sum += v;
    }
    return { nonZeroPx: nz, maxRGBsum: max, avgRGBsum: +(sum / (arr.length / 4)).toFixed(3) };
  }

  setTimeout(function () {
    var report = { mode: window.BG.mode, logs: logs };
    var r = window.__r;
    try {
      var gl = r.getContext();
      report.pointSizeRange = gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE);
      report.hasWebGL2 = r.capabilities && r.capabilities.isWebGL2;
      report.programs = (r.info.programs || []).map(function (p) {
        return { usedTimes: p.usedTimes, runnable: p.runnable, diag: p.diagnostics || null };
      });
      report.renderInfo = r.info.render;
      var sc = window.__lastScene, cam = window.__lastCam;
      report.hasScene = !!sc;
      if (sc && cam) {
        // 只渲染粒子层（第 2 个 child 是 Points），单独统计它的像素产出
        r.render(sc, cam);
        var w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
        var buf = new Uint8Array(w * h * 4);
        gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
        report.buffer = w + 'x' + h;
        report.afterRender = stat(buf);

        // 找出 Points 对象，读它的几何体与 material 关键值
        for (var i = 0; i < sc.children.length; i++) {
          var g = sc.children[i];
          for (var j = 0; j < g.children.length; j++) {
            var o = g.children[j];
            if (o.isPoints) {
              report.pointsCount = o.geometry.drawRange ? o.geometry.drawRange.count : -1;
              report.hasAttrs = Object.keys(o.geometry.attributes);
              report.uOpacity = o.material.uniforms.uOpacity.value;
              report.uPixelRatio = o.material.uniforms.uPixelRatio.value;
              report.uTime = o.material.uniforms.uTime.value;
              report.blending = o.material.blending;
              report.visible = o.visible;
              report.program = (function () {
                try {
                  var p = r.info.programs.filter(function (q) { return q.usedTimes > 0; });
                  return p.length + ' program(s) used';
                } catch (e) { return 'n/a'; }
              })();
            }
          }
        }
      }
    } catch (e) {
      report.error = e && (e.message + '\n' + e.stack);
    }
    var text = 'RESULT ' + JSON.stringify(report, null, 1);
    document.getElementById('out').textContent = text;
    try {
      fetch('/report', { method: 'POST', body: text });
    } catch (e) { }
  }, 900);
</script>
</body>
</html>
